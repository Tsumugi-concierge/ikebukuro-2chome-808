<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Breaker — Ikebukuro 2Chōme808</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #d4651e;
    --accent-light: #fcd3ae;
    --cream: #fdf6ee;
    --text-dark: #3a3232;
    --text-mid: #6b5a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--text-dark); min-height: 100vh; }
  .top-bar {
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, black) 100%);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .back-btn {
    background: rgba(255,255,255,0.25);
    border: none;
    border-radius: 50%;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    color: #fff;
    text-decoration: none;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.4); }
  .top-title { font-family: 'Pacifico', cursive; font-size: 1.3rem; color: #fff; text-shadow: 1px 2px 4px rgba(0,0,0,0.2); flex: 1; }
  .top-emoji { font-size: 1.8rem; }
  .content { padding: 20px 16px 40px; max-width: 640px; margin: 0 auto; }
  .lang-bar { display: flex; justify-content: center; gap: 6px; padding: 10px 16px; flex-wrap: wrap; background: var(--cream); }
  .lang-btn { border: 2px solid var(--accent-light); background: rgba(255,255,255,0.92); border-radius: 50px; padding: 4px 9px; font-family: 'Nunito', sans-serif; font-size: 0.72rem; font-weight: 800; color: var(--text-mid); cursor: pointer; transition: all 0.2s; }
  .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lang-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  .alert-card {
    background: #fff8f0;
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 20px;
  }
  .alert-icon { font-size: 2.8rem; text-align: center; margin-bottom: 12px; }
  .alert-title { font-family: 'Pacifico', cursive; font-size: 1.1rem; color: var(--accent); margin-bottom: 14px; text-align: center; }
  .step-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .step-item { display: flex; gap: 12px; align-items: flex-start; background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(120,80,60,0.08); }
  .step-num { background: var(--accent); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; flex-shrink: 0; margin-top: 2px; }
  .step-text { font-size: 0.95rem; line-height: 1.6; color: var(--text-dark); }
  .step-sub { font-size: 0.82rem; color: var(--text-mid); margin-top: 4px; }
  .location-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-light); color: var(--accent); font-weight: 900; font-size: 0.82rem; border-radius: 50px; padding: 5px 12px; margin-top: 14px; }
  .back-footer { text-align: center; margin-top: 28px; padding-bottom: 20px; }
  .back-footer a { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; font-size: 1rem; text-decoration: none; background: var(--accent-light); padding: 12px 24px; border-radius: 50px; transition: opacity 0.2s; }
  .back-footer a:hover { opacity: 0.8; }
</style>
  <link rel="stylesheet" href="../assets/cute-pack.css">
  <style id="cute-pack-theme">:root{--cp-chip-a:#fff3e8;--cp-chip-b:#fdeef4;--cp-hover-shadow:rgba(220,140,90,.18);--cp-dot-1:rgba(240,170,120,.10);}</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en',this)">🇬🇧 EN</button>
  <button class="lang-btn" onclick="setLang('ja',this)">🇯🇵 JA</button>
  <button class="lang-btn" onclick="setLang('zh',this)">🇨🇳 ZH</button>
  <button class="lang-btn" onclick="setLang('ko',this)">🇰🇷 KO</button>
  <button class="lang-btn" onclick="setLang('fr',this)">🇫🇷 FR</button>
  <button class="lang-btn" onclick="setLang('es',this)">🇪🇸 ES</button>
</div>
<div class="top-bar">
  <a href="../" class="back-btn">←</a>
  <span class="top-emoji">⚡</span>
  <div class="top-title" data-i18n="pageTitle">Circuit Breaker</div>
</div>
<div class="content">
  <div class="alert-card">
    <div class="alert-icon">⚡</div>
    <div class="alert-title" data-i18n="cardTitle">If the Breaker Trips</div>
    <ol class="step-list">
      <li class="step-item">
        <span class="step-num">1</span>
        <div>
          <div class="step-text" data-i18n="step1">Turn off all appliances that were in use at the time.</div>
        </div>
      </li>
      <li class="step-item">
        <span class="step-num">2</span>
        <div>
          <div class="step-text" data-i18n="step2">Find the circuit breaker panel in the kitchen.</div>
        </div>
      </li>
      <li class="step-item">
        <span class="step-num">3</span>
        <div>
          <div class="step-text" data-i18n="step3">Flip all the switches back up.</div>
        </div>
      </li>
    </ol>
    <div class="location-badge">🍳 <span data-i18n="location">Located in the kitchen</span></div>
  </div>
  <div class="back-footer">
    <a href="../" data-i18n="backToMenu">← Back to Menu</a>
  </div>
</div>
<script>
const S = {
  en: {
    pageTitle: 'Circuit Breaker',
    cardTitle: 'If the Breaker Trips',
    step1: 'Turn off all appliances that were in use at the time.',
    step2: 'Find the circuit breaker panel in the kitchen.',
    step3: 'Flip all the switches back up.',
    location: 'Located in the kitchen',
    backToMenu: '← Back to Menu',
  },
  ja: {
    pageTitle: 'ブレーカー',
    cardTitle: 'ブレーカーが落ちた場合',
    step1: 'ご使用中の電化製品をすべてOFFにしてください。',
    step2: 'キッチンにあるブレーカーを確認してください。',
    step3: 'ブレーカーのスイッチをすべて上げてください。',
    location: 'キッチンにあります',
    backToMenu: '← メニューへ戻る',
  },
  zh: {
    pageTitle: '断路器',
    cardTitle: '跳闸时的处理方法',
    step1: '关闭当时正在使用的所有电器。',
    step2: '找到厨房里的断路器箱。',
    step3: '将所有开关重新拨回上方。',
    location: '位于厨房',
    backToMenu: '← 返回菜单',
  },
  ko: {
    pageTitle: '차단기',
    cardTitle: '차단기가 내려갔을 때',
    step1: '사용 중이던 가전제품을 모두 끄세요.',
    step2: '주방에 있는 차단기 패널을 찾으세요.',
    step3: '모든 스위치를 위로 올려주세요.',
    location: '주방에 위치',
    backToMenu: '← 메뉴로 돌아가기',
  },
  fr: {
    pageTitle: 'Disjoncteur',
    cardTitle: 'En cas de déclenchement',
    step1: 'Éteignez tous les appareils qui étaient en cours d\'utilisation.',
    step2: 'Localisez le tableau électrique dans la cuisine.',
    step3: 'Relevez tous les interrupteurs.',
    location: 'Situé dans la cuisine',
    backToMenu: '← Retour au menu',
  },
  es: {
    pageTitle: 'Disyuntor',
    cardTitle: 'Si salta el disyuntor',
    step1: 'Apague todos los electrodomésticos que estaban en uso.',
    step2: 'Localice el panel del disyuntor en la cocina.',
    step3: 'Suba todos los interruptores.',
    location: 'Ubicado en la cocina',
    backToMenu: '← Volver al menú',
  },
};
function setLang(l, btn) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = S[l];
  if (!t) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (k in t) el.textContent = t[k];
  });
}
setLang('en', document.querySelector('.lang-btn.active'));
</script>
  <script src="../assets/cute-pack.js" defer></script>
</body>
</html>
