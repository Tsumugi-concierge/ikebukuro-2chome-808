<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry — Ikebukuro 2Chōme808</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --accent: #d4651e; --accent-light: #fcd3ae; --cream: #fdf6ee; --text-dark: #3a3232; --text-mid: #6b5a5a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--text-dark); min-height: 100vh; }
  .top-bar { background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, black) 100%); padding: 16px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .back-btn { background: rgba(255,255,255,0.25); border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; text-decoration: none; flex-shrink: 0; transition: background 0.2s; }
  .back-btn:hover { background: rgba(255,255,255,0.4); }
  .top-title { font-family: 'Pacifico', cursive; font-size: 1.3rem; color: #fff; text-shadow: 1px 2px 4px rgba(0,0,0,0.2); flex: 1; }
  .top-emoji { font-size: 1.8rem; }
  .content { padding: 20px 16px 40px; max-width: 640px; margin: 0 auto; }
  .lang-bar { display: flex; justify-content: center; gap: 6px; padding: 10px 16px; flex-wrap: wrap; background: var(--cream); }
  .lang-btn { border: 2px solid var(--accent-light); background: rgba(255,255,255,0.92); border-radius: 50px; padding: 4px 9px; font-family: 'Nunito', sans-serif; font-size: 0.72rem; font-weight: 800; color: var(--text-mid); cursor: pointer; transition: all 0.2s; }
  .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lang-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .card { background: #fff; border-radius: 16px; padding: 22px 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(120,80,60,0.08); }
  .card-title { font-family: 'Pacifico', cursive; font-size: 1.05rem; color: var(--accent); margin-bottom: 14px; }
  .step-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .step-item { display: flex; gap: 12px; align-items: flex-start; }
  .step-num { background: var(--accent); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; flex-shrink: 0; margin-top: 2px; }
  .step-text { font-size: 0.95rem; line-height: 1.6; }
  .step-sub { font-size: 0.82rem; color: var(--text-mid); margin-top: 3px; }
  .notion-link { display: flex; align-items: center; gap: 8px; background: var(--accent-light); color: var(--accent); font-weight: 800; font-size: 0.85rem; border-radius: 12px; padding: 12px 16px; margin-top: 16px; text-decoration: none; transition: opacity 0.2s; }
  .notion-link:hover { opacity: 0.8; }
  .back-footer { text-align: center; margin-top: 28px; padding-bottom: 20px; }
  .back-footer a { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; font-size: 1rem; text-decoration: none; background: var(--accent-light); padding: 12px 24px; border-radius: 50px; transition: opacity 0.2s; }
  .back-footer a:hover { opacity: 0.8; }
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en',this)">🇬🇧 EN</button>
  <button class="lang-btn" onclick="setLang('ja',this)">🇯🇵 JA</button>
  <button class="lang-btn" onclick="setLang('zh',this)">🇨🇳 ZH</button>
  <button class="lang-btn" onclick="setLang('ko',this)">🇰🇷 KO</button>
  <button class="lang-btn" onclick="setLang('fr',this)">🇫🇷 FR</button>
  <button class="lang-btn" onclick="setLang('es',this)">🇪🇸 ES</button>
</div>
<div class="top-bar">
  <a href="../" class="back-btn">←</a>
  <span class="top-emoji">🫧</span>
  <div class="top-title" data-i18n="pageTitle">Laundry</div>
</div>
<div class="content">
  <div class="card">
    <div class="card-title" data-i18n="howToUse">How to Use the Washing Machine</div>
    <ol class="step-list">
      <li class="step-item">
        <span class="step-num">1</span>
        <div><div class="step-text" data-i18n="step1">Press the power button.</div></div>
      </li>
      <li class="step-item">
        <span class="step-num">2</span>
        <div>
          <div class="step-text" data-i18n="step2">Select <strong>Standard (標準)</strong> course.</div>
        </div>
      </li>
      <li class="step-item">
        <span class="step-num">3</span>
        <div><div class="step-text" data-i18n="step3">Press Start.</div></div>
      </li>
    </ol>
    <a class="notion-link" href="https://wirehaired-nerine-c7f.notion.site/HOUSE-MANUAL-1a5b54bc854381d9912de226933d45bd" target="_blank">
      📷 <span data-i18n="photoLink">View panel photo in House Manual</span>
    </a>
  </div>
  <div class="back-footer">
    <a href="../" data-i18n="backToMenu">← Back to Menu</a>
  </div>
</div>
<script>
const S = {
  en: { pageTitle:'Laundry', howToUse:'How to Use the Washing Machine', step1:'Press the power button.', step2:'Select Standard course.', step3:'Press Start.', photoLink:'View panel photo in House Manual', backToMenu:'← Back to Menu' },
  ja: { pageTitle:'洗濯機', howToUse:'洗濯機の使い方', step1:'電源ボタンを押します。', step2:'「標準」コースを選択します。', step3:'スタートを押します。', photoLink:'ハウスマニュアルで操作パネルの写真を見る', backToMenu:'← メニューへ戻る' },
  zh: { pageTitle:'洗衣机', howToUse:'洗衣机使用方法', step1:'按下电源按钮。', step2:'选择标准（Standard）程序。', step3:'按下开始。', photoLink:'在房屋手册中查看面板照片', backToMenu:'← 返回菜单' },
  ko: { pageTitle:'세탁기', howToUse:'세탁기 사용 방법', step1:'전원 버튼을 누르세요.', step2:'표준(Standard) 코스를 선택하세요.', step3:'시작을 누르세요.', photoLink:'하우스 매뉴얼에서 패널 사진 보기', backToMenu:'← 메뉴로 돌아가기' },
  fr: { pageTitle:'Lessive', howToUse:'Comment utiliser le lave-linge', step1:'Appuyez sur le bouton marche/arrêt.', step2:'Sélectionnez le programme Standard.', step3:'Appuyez sur Démarrer.', photoLink:'Voir la photo du panneau dans le manuel', backToMenu:'← Retour au menu' },
  es: { pageTitle:'Lavadora', howToUse:'Cómo usar la lavadora', step1:'Pulse el botón de encendido.', step2:'Seleccione el programa Estándar.', step3:'Pulse Inicio.', photoLink:'Ver foto del panel en el manual de la casa', backToMenu:'← Volver al menú' },
};
function setLang(l,btn){document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const t=S[l];if(!t)return;document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(k in t)el.textContent=t[k];});}
setLang('en',document.querySelector('.lang-btn.active'));
</script>
</body>
</html>
